name: Fix auth system web test

on:
  push:
    branches:
      - feature/p17-real-app
    paths:
      - .github/workflows/fix-auth-system-web-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Update obsolete web service-worker expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/auth.system.ts')
          text = path.read_text()
          old = """test('real PWA returns a connection error offline and can retry server-side logout online', async ({
            page,
            context,
          }) => {
            const email = `${randomUUID()}@example.test`;
            await register(page, email);
            await login(page, email);
            await page.evaluate(async () => {
              await navigator.serviceWorker.ready;
            });
            await page.waitForFunction(() => navigator.serviceWorker.controller !== null);
            await context.setOffline(true);
            await page.getByRole('button', { name: 'Cerrar sesión', exact: true }).click();
            await expect(page.getByRole('status').filter({ hasText: 'No pudimos conectar' })).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Tu sesión', exact: true })).toBeVisible();
            await context.setOffline(false);
            await page.getByRole('button', { name: 'Cerrar sesión', exact: true }).click();
            await expect(page.getByRole('heading', { name: 'Bienvenido de nuevo' })).toBeVisible();
            await login(page, email);
            await page.reload();
            await expect(page.getByRole('heading', { name: 'Bienvenido de nuevo' })).toBeVisible();
            expect(
              await page.evaluate(() => JSON.stringify(localStorage) + JSON.stringify(sessionStorage)),
            ).not.toContain('fp_');
          });"""
          new = """test('real web returns a connection error offline and can retry server-side logout online', async ({
            page,
            context,
          }) => {
            const email = `${randomUUID()}@example.test`;
            await register(page, email);
            await login(page, email);
            await context.setOffline(true);
            await page.getByRole('button', { name: 'Cerrar sesión', exact: true }).click();
            await expect(page.getByRole('status').filter({ hasText: 'No pudimos conectar' })).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Tu sesión', exact: true })).toBeVisible();
            await context.setOffline(false);
            await page.getByRole('button', { name: 'Cerrar sesión', exact: true }).click();
            await expect(page.getByRole('heading', { name: 'Bienvenido de nuevo' })).toBeVisible();
            await login(page, email);
            await page.reload();
            await expect(page.getByRole('heading', { name: 'Bienvenido de nuevo' })).toBeVisible();
            expect(
              await page.evaluate(() => JSON.stringify(localStorage) + JSON.stringify(sessionStorage)),
            ).not.toContain('fp_');
          });"""
          if old not in text:
              raise SystemExit('Expected auth system test block not found')
          path.write_text(text.replace(old, new))
          PY
      - run: npm exec prettier -- --write tests/auth.system.ts packages/ui/src/shell.ts
      - run: npm run format:check
      - run: npm run lint
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/auth.system.ts packages/ui/src/shell.ts
          git commit -m "fix(auth): align system flow with reactive login shell"
          git push origin HEAD:feature/p17-real-app
