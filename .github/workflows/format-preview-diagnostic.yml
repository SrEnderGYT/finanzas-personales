name: Format preview diagnostic
on:
  push:
    branches: ['feature/p16-bcp-review']
permissions:
  contents: read
jobs:
  prettier-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Format changed UI files
        run: |
          npm exec -- prettier --write \
            packages/ui/src/product-preview.ts \
            packages/ui/src/public-product-screen.ts \
            packages/ui/src/public-product-screen.css \
            packages/ui/src/public-auth-screen.ts \
            packages/ui/src/public-auth-screen.css \
            packages/ui/src/latest-screen.ts \
            packages/ui/src/latest-auth-screen.ts \
            packages/ui/src/routes.ts \
            tests/ui.e2e.ts
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prettier-formatted-${{ github.sha }}
          path: |
            packages/ui/src/product-preview.ts
            packages/ui/src/public-product-screen.ts
            packages/ui/src/public-product-screen.css
            packages/ui/src/public-auth-screen.ts
            packages/ui/src/public-auth-screen.css
            packages/ui/src/latest-screen.ts
            packages/ui/src/latest-auth-screen.ts
            packages/ui/src/routes.ts
            tests/ui.e2e.ts
          retention-days: 1
