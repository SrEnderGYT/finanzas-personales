name: Normalize public product
on:
  push:
    branches: ['feature/p16-bcp-review']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p16-bcp-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Fix Angular template compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/ui/src/public-product-screen.ts')
          text = path.read_text()
          text = text.replace("formatMinor(account.minor, account.currency)", "formatExact(account.minor, account.currency)")
          text = text.replace("formatMinor(row.minor, row.currency)", "formatExact(row.minor, row.currency)")
          text = text.replace(
              "state.totals().balance >= 0n ? 'Tus ingresos superan tus gastos en el periodo.' : 'Tus gastos superan tus ingresos en el periodo.'",
              "balancePositive() ? 'Tus ingresos superan tus gastos en el periodo.' : 'Tus gastos superan tus ingresos en el periodo.'",
          )
          marker = "  readonly budgetPercent = computed(() =>\n    Math.min(100, Number((this.monthExpense() * 100n) / this.budgetLimit())),\n  );\n"
          if "readonly balancePositive" not in text:
              text = text.replace(marker, marker + "  readonly balancePositive = computed(() => this.state.totals().balance >= 0n);\n")
          money = "  money(value: string | bigint) {\n    return this.state.hidden() ? '••••' : formatMinor(value, this.state.currency());\n  }\n"
          if "formatExact(value" not in text:
              text = text.replace(money, money + "\n  formatExact(value: string | bigint, currency: 'PEN' | 'USD') {\n    return formatMinor(value, currency);\n  }\n")
          path.write_text(text)
          PY
      - name: Format current product files
        run: |
          npm exec -- prettier --write \
            packages/ui/src/product-preview.ts \
            packages/ui/src/public-product-screen.ts \
            packages/ui/src/public-product-screen.css \
            packages/ui/src/public-auth-screen.ts \
            packages/ui/src/public-auth-screen.css \
            packages/ui/src/latest-screen.ts \
            packages/ui/src/latest-auth-screen.ts \
            packages/ui/src/routes.ts \
            tests/ui.e2e.ts \
            .github/workflows/format-preview-diagnostic.yml
          git diff --check
      - name: Validate web build
        run: npm run build:web
      - name: Commit normalized product files
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/product-preview.ts \
            packages/ui/src/public-product-screen.ts \
            packages/ui/src/public-product-screen.css \
            packages/ui/src/public-auth-screen.ts \
            packages/ui/src/public-auth-screen.css \
            packages/ui/src/latest-screen.ts \
            packages/ui/src/latest-auth-screen.ts \
            packages/ui/src/routes.ts \
            tests/ui.e2e.ts \
            .github/workflows/format-preview-diagnostic.yml
          git commit -m "fix(ui): normalize public finance product"
          git push origin HEAD:feature/p16-bcp-review
