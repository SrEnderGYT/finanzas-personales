name: P17 Lint Cleanup One Shot
on:
  push:
    branches: ['feature/p17-real-app']
    paths: ['.github/workflows/p17-lint-cleanup-one-shot.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/api/src/gmail-service.ts')
          s = p.read_text()
          old = "    const client = await this.pool.connect();\n    let id = '';\n    let rangeDays = 30;\n    try {\n"
          new = "    const client = await this.pool.connect();\n    let authorization: { id: string; rangeDays: number } | undefined;\n    try {\n"
          if old in s:
              s = s.replace(old, new, 1)
              old = "      id = userId(String(flow.rows[0].user_id));\n      rangeDays = Number(flow.rows[0].range_days);\n      await client.query('UPDATE app.gmail_oauth_flows SET used_at=now() WHERE state_hash=$1', [sha256(state)]);\n      await client.query('COMMIT');\n"
              new = "      const id = userId(String(flow.rows[0].user_id));\n      const rangeDays = Number(flow.rows[0].range_days);\n      await client.query('UPDATE app.gmail_oauth_flows SET used_at=now() WHERE state_hash=$1', [sha256(state)]);\n      await client.query('COMMIT');\n      authorization = { id, rangeDays };\n"
              assert s.count(old) == 1
              s = s.replace(old, new, 1)
              old = "    const token = await this.exchangeCode(code);\n    const profile = await this.profile(token.accessToken);\n"
              new = "    if (!authorization) throw new Error('Gmail authorization expired');\n    const { id, rangeDays } = authorization;\n    const token = await this.exchangeCode(code);\n    const profile = await this.profile(token.accessToken);\n"
              assert s.count(old) == 1
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('scripts/configure-web-origin.mjs')
          s = p.read_text()
          old = "import { createHash } from 'node:crypto';\nimport { readFile, writeFile } from 'node:fs/promises';\n"
          if old in s:
              new = "import { createHash } from 'node:crypto';\nimport { readFile, writeFile } from 'node:fs/promises';\nimport process from 'node:process';\nimport { URL } from 'node:url';\n"
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Normalize P17 files
        run: >-
          npx prettier --write
          packages/shared/src/gmail-candidates.ts
          packages/ui/src/backend-required-screen.ts
          packages/ui/src/detected-finances-screen.ts
          packages/ui/src/gmail-screen.ts
          packages/ui/src/public-auth-screen.ts
          packages/ui/src/shell.ts
          backend/api/src/financial-mail-parser.ts
          backend/api/src/gmail-controller.ts
          backend/api/src/gmail-import-service.ts
          backend/api/src/gmail-service.ts
          backend/api/src/web-cors.ts
          scripts/configure-web-origin.mjs
          tests/gmail-ingestion.test.ts
          .github/workflows/preview.yml
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Show formatted preview workflow
        run: cat .github/workflows/preview.yml
      - name: Commit validated code cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared/src/gmail-candidates.ts packages/ui/src/backend-required-screen.ts packages/ui/src/detected-finances-screen.ts packages/ui/src/gmail-screen.ts packages/ui/src/public-auth-screen.ts packages/ui/src/shell.ts backend/api/src/financial-mail-parser.ts backend/api/src/gmail-controller.ts backend/api/src/gmail-import-service.ts backend/api/src/gmail-service.ts backend/api/src/web-cors.ts scripts/configure-web-origin.mjs tests/gmail-ingestion.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p17): normalize quality checks'
          git push origin HEAD:feature/p17-real-app
