name: Format diagnostic
on:
  push:
    branches: ['fix/p15-format-diagnostic']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: >-
          npx prettier --write
          packages/ui/src/auth-client.ts
          packages/ui/src/gmail-screen.ts
          packages/ui/src/product-screen.ts
          backend/api/src/app.ts
          backend/api/src/gmail-controller.ts
          tests/gmail-controller.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prettier-formatted-sources
          path: |
            packages/ui/src/auth-client.ts
            packages/ui/src/gmail-screen.ts
            packages/ui/src/product-screen.ts
            backend/api/src/app.ts
            backend/api/src/gmail-controller.ts
            tests/gmail-controller.test.ts
