name: Format Gmail semantics test

on:
  push:
    branches:
      - feature/p17-real-app
    paths:
      - .github/workflows/format-gmail-semantics.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm exec prettier -- --write tests/gmail-semantics.test.ts
      - run: npm run format:check
      - run: npm exec vitest -- run tests/gmail-semantics.test.ts
      - name: Commit normalized test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/gmail-semantics.test.ts
          git commit -m "style(test): normalize Gmail semantics regression"
          git push origin HEAD:feature/p17-real-app
