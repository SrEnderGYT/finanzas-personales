name: P17 Auth Client Refactor
on:
  push:
    branches: ['feature/p17-real-app']
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - name: Refactor authenticated Gmail request client
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/ui/src/auth-client.ts')
          text = path.read_text()
          old = """  async gmail(\n    path: 'connection' | 'oauth/start' | 'sync',\n    method: 'GET' | 'POST' | 'DELETE',\n    body?: unknown,\n    signal?: AbortSignal,\n  ): Promise<unknown> {\n    if (!this.enabled || !this.token) throw new SyncHttpError(401, 'SESSION_REQUIRED');\n"""
          new = """  async gmail(\n    path: string,\n    method: 'GET' | 'POST' | 'DELETE',\n    body?: unknown,\n    signal?: AbortSignal,\n  ): Promise<unknown> {\n    const safePath =\n      path === 'connection' ||\n      path === 'oauth/start' ||\n      path === 'sync' ||\n      /^candidates(?:\\?status=(?:pending|confirmed|discarded|all))?$/.test(path) ||\n      /^candidates\\/[0-9a-f-]{36}\\/(?:confirm|discard)$/.test(path);\n    if (!safePath) throw new Error('Ruta Gmail no permitida.');\n    if (!this.enabled || !this.token) throw new SyncHttpError(401, 'SESSION_REQUIRED');\n"""
          if old not in text:
              raise SystemExit('Expected Gmail method signature not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "throw new Error('El acceso aún no está habilitado en esta vista de muestra.');",
              "throw new Error('El servidor de acceso no está configurado en este cliente.');",
              1,
          )
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/p17-auth-client-refactor.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/auth-client.ts .github/workflows/p17-auth-client-refactor.yml
          git commit -m "feat(p17): expose safe authenticated Gmail candidate requests"
          git push origin HEAD:feature/p17-real-app
