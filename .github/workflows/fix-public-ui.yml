name: Fix public UI
on:
  push:
    branches: ['feature/p16-bcp-review']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p16-bcp-review
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply accessibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('packages/ui/src/public-auth-screen.ts')
          text = auth.read_text()
          text = text.replace('                readonly\n                aria-describedby="public-login-note"', '                disabled\n                aria-describedby="public-login-note"')
          auth.write_text(text)

          css = Path('packages/ui/src/public-product-screen.css')
          text = css.read_text()
          text = text.replace('.panel-heading > a,\n.settings-link {\n  color: var(--primary);', '.panel-heading > a,\n.settings-link {\n  color: var(--text);')
          text = text.replace('.budget-panel > a {\n  display: inline-block;\n  margin-top: 13px;\n  color: var(--primary);', '.budget-panel > a {\n  display: inline-block;\n  margin-top: 13px;\n  color: var(--text);')
          css.write_text(text)
          PY
      - name: Normalize formatting
        run: |
          npm exec -- prettier --write \
            packages/ui/src/locked-product-screen.ts \
            packages/ui/src/shell.ts \
            packages/ui/src/public-auth-screen.ts \
            packages/ui/src/public-product-screen.css \
            .github/workflows/fix-public-ui.yml
          git diff --check
      - name: Validate web build
        run: npm run build:web
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/locked-product-screen.ts \
            packages/ui/src/shell.ts \
            packages/ui/src/public-auth-screen.ts \
            packages/ui/src/public-product-screen.css \
            .github/workflows/fix-public-ui.yml
          git commit -m "fix(ui): close public accessibility regressions"
          git push origin HEAD:feature/p16-bcp-review
