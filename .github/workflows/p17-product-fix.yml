name: P17 product flow repair

on:
  push:
    branches: [feature/p17-real-app]
    paths:
      - .github/workflows/p17-product-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Apply product repair
        run: python3 scripts/p17-product-fix-v2.py
      - name: Normalize changed TypeScript
        run: npm exec prettier -- --write backend/api/src/financial-mail-parser.ts backend/api/src/gmail-service.ts packages/ui/src/detected-finances-screen.ts packages/ui/src/product-workspace.ts packages/ui/src/latest-screen.ts packages/ui/src/manual-screen.ts packages/ui/src/product-screen.ts tests/gmail-ingestion.test.ts
      - name: Validate focused repair
        run: |
          npm run typecheck
          npm test -- --run tests/gmail-ingestion.test.ts
          npm run build:web
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/src/financial-mail-parser.ts backend/api/src/gmail-service.ts backend/api/migrations/024_gmail_marketing_cleanup.sql packages/ui/src/detected-finances-screen.ts packages/ui/src/product-workspace.ts packages/ui/src/latest-screen.ts packages/ui/src/manual-screen.ts packages/ui/src/product-screen.ts tests/gmail-ingestion.test.ts
          git commit -m "fix(product): connect confirmed finances to real workspace"
          git push origin HEAD:feature/p17-real-app
