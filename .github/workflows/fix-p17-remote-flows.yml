name: Fix P17 remote flows

on:
  push:
    branches:
      - feature/p17-real-app
    paths:
      - .github/workflows/fix-p17-remote-flows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Patch remote-safe flows
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'tests/auth.system.ts',
              """    await page.getByRole('button', { name: 'Actualizar sesiones' }).click();
              await expect(page.locator('.auth-sessions li')).toHaveCount(2);
              await expect(other.locator('.auth-sessions li')).toHaveCount(1);""",
              """    await page.getByRole('button', { name: 'Actualizar sesiones' }).click();
              await other.getByRole('button', { name: 'Actualizar sesiones' }).click();
              await expect(page.locator('.auth-sessions li')).toHaveCount(2);
              await expect(other.locator('.auth-sessions li')).toHaveCount(1);""",
          )

          replace(
              'packages/ui/src/product-workspace.ts',
              """import type { OutboxRecord } from '../../shared/src/manual-outbox';
          import type { ManualCatalog } from '../../domain/src';
          import { CorrectionQueue, type CorrectionRecord } from '../../shared/src/correction-queue';""",
              """import type { OutboxRecord } from '../../shared/src/manual-outbox';
          import {
            canonical,
            normalizeCorrection,
            type CorrectionResult,
            type ManualCatalog,
            type ManualCorrection,
          } from '../../domain/src';
          import {
            CorrectionQueue,
            correctionResult,
            type CorrectionRecord,
          } from '../../shared/src/correction-queue';
          import { digest } from '../../shared/src/product-vault';""",
          )

          replace(
              'packages/ui/src/product-workspace.ts',
              """  async submitCorrection(input: unknown) {
              const session = this.session,
                epoch = this.epoch;
              if (!session?.vault.unlocked || session.vault.profile.mode !== 'product') return;
              const row = await new CorrectionQueue(session.vault).enqueue(input);
              if (epoch !== this.epoch) return;
              await this.refresh();
              if (epoch === this.epoch) await this.sendCorrection(row.command.operationId);
            }
            async sendCorrection(id: string) {
              const session = this.session,
                epoch = this.epoch;
              if (!session?.vault.unlocked || this.correcting()) return;
              if (!navigator.onLine) {
                this.error.set('Corrección guardada en este dispositivo. Reintenta cuando tengas conexión.');
                return;
              }
              if (!this.auth.canUseOwner(session.vault.profile.ownerId)) {
                this.state.set('session_required');
                return;
              }
              this.correcting.set(true);
              this.correctionAbort = new AbortController();
              this.error.set('');
              try {
                const result = await new CorrectionQueue(session.vault).send(
                  id,
                  this.auth.correctionApi(session.vault.profile.ownerId),
                  this.correctionAbort.signal,
                );
                if (epoch !== this.epoch) return;
                await this.refresh();
                if (epoch !== this.epoch) return;
                if (result.state === 'applied') await this.syncNow();
              } catch (error) {
                if (epoch !== this.epoch) return;
                if (error instanceof SyncHttpError && error.status === 401) {
                  this.auth.expireSession();
                  return;
                }
                await this.refresh().catch(() => {});
                if (epoch === this.epoch)
                  this.error.set('La corrección se conserva. Comprueba tu conexión y vuelve a intentar.');
              } finally {
                this.correcting.set(false);
              }
            }""",
              """  private replaceRemoteCorrection(record: CorrectionRecord) {
              this.corrections.update((rows) => [
                ...rows.filter((row) => row.command.operationId !== record.command.operationId),
                record,
              ]);
            }
            private appliedRemoteCorrection(
              row: CorrectionRecord,
              server: import('../../domain/src').MovementVersion,
            ): CorrectionRecord {
              const result: CorrectionResult = {
                status: 'applied',
                operationId: row.command.operationId,
                payloadHash: row.hash,
                server,
                action: row.command.action,
              };
              return { version: 1, command: row.command, hash: row.hash, state: 'applied', result };
            }
            async submitCorrection(input: unknown) {
              const session = this.session,
                epoch = this.epoch;
              if (session?.vault.unlocked && session.vault.profile.mode === 'product') {
                const row = await new CorrectionQueue(session.vault).enqueue(input);
                if (epoch !== this.epoch) return;
                await this.refresh();
                if (epoch === this.epoch) await this.sendCorrection(row.command.operationId);
                return;
              }
              const owner = this.remoteOwner();
              if (!owner || !this.auth.canUseOwner(owner)) {
                this.state.set('session_required');
                return;
              }
              const command = normalizeCorrection(input, { now: () => new Date() });
              const hash = await digest(canonical(command));
              const existing = this.corrections().find(
                (row) => row.command.operationId === command.operationId,
              );
              if (existing && existing.hash !== hash) throw new Error('IDEMPOTENCY_CONFLICT');
              if (!existing)
                this.replaceRemoteCorrection({ version: 1, command, hash, state: 'pending' });
              if (epoch === this.epoch) await this.sendCorrection(command.operationId);
            }
            async sendCorrection(id: string) {
              const session = this.session,
                epoch = this.epoch;
              if (this.correcting()) return;
              if (session?.vault.unlocked && session.vault.profile.mode === 'product') {
                if (!navigator.onLine) {
                  this.error.set('Corrección guardada en este dispositivo. Reintenta cuando tengas conexión.');
                  return;
                }
                if (!this.auth.canUseOwner(session.vault.profile.ownerId)) {
                  this.state.set('session_required');
                  return;
                }
                this.correcting.set(true);
                this.correctionAbort = new AbortController();
                this.error.set('');
                try {
                  const result = await new CorrectionQueue(session.vault).send(
                    id,
                    this.auth.correctionApi(session.vault.profile.ownerId),
                    this.correctionAbort.signal,
                  );
                  if (epoch !== this.epoch) return;
                  await this.refresh();
                  if (epoch !== this.epoch) return;
                  if (result.state === 'applied') await this.syncNow();
                } catch (error) {
                  if (epoch !== this.epoch) return;
                  if (error instanceof SyncHttpError && error.status === 401) {
                    this.auth.expireSession();
                    return;
                  }
                  await this.refresh().catch(() => {});
                  if (epoch === this.epoch)
                    this.error.set(
                      'La corrección se conserva. Comprueba tu conexión y vuelve a intentar.',
                    );
                } finally {
                  this.correcting.set(false);
                }
                return;
              }

              const owner = this.remoteOwner();
              const row = this.corrections().find((item) => item.command.operationId === id);
              if (!owner || !row || row.state === 'applied' || row.state === 'requires_review') return;
              if (!navigator.onLine) {
                this.error.set('Corrección pendiente. Reintenta cuando tengas conexión.');
                return;
              }
              if (!this.auth.canUseOwner(owner)) {
                this.state.set('session_required');
                return;
              }
              this.correcting.set(true);
              this.correctionAbort = new AbortController();
              this.error.set('');
              this.replaceRemoteCorrection({
                ...row,
                state: 'sending',
                attempt: {
                  id: crypto.randomUUID(),
                  expiresAt: new Date(Date.now() + 60_000).toISOString(),
                },
              });
              const api = this.auth.correctionApi(owner);
              try {
                const result = correctionResult(
                  await api.execute(row.command, this.correctionAbort.signal),
                  row.command,
                  row.hash,
                  { now: () => new Date() },
                );
                if (epoch !== this.epoch) return;
                this.replaceRemoteCorrection({
                  version: 1,
                  command: row.command,
                  hash: row.hash,
                  state: result.status === 'conflict' ? 'requires_review' : 'applied',
                  result,
                });
                if (result.status === 'applied') await this.openRemote();
              } catch (error) {
                if (epoch !== this.epoch) return;
                if (error instanceof SyncHttpError && error.status === 401) {
                  this.auth.expireSession();
                  return;
                }
                if (row.command.action === 'replace') {
                  try {
                    const current = await api.current(row.command.rootId, AbortSignal.timeout(5000));
                    if (
                      current.movementId === row.command.replacement.movementId &&
                      canonical(current.payload) === canonical(row.command.replacement.payload)
                    ) {
                      this.replaceRemoteCorrection(this.appliedRemoteCorrection(row, current));
                      await this.openRemote();
                      return;
                    }
                  } catch {
                    // Keep the exact financial intention retryable when reconciliation is unavailable.
                  }
                }
                this.replaceRemoteCorrection({
                  version: 1,
                  command: row.command,
                  hash: row.hash,
                  state: 'retryable',
                });
                this.error.set('La corrección se conserva. Comprueba tu conexión y vuelve a intentar.');
              } finally {
                this.correcting.set(false);
              }
            }""",
          )

          replace(
              'packages/ui/src/manual-screen.ts',
              """  type CatalogEnvelope,
            type ManualCatalog,
          } from '../../domain/src';""",
              """  type CatalogEnvelope,
            type ManualCatalog,
            type ManualCommand,
          } from '../../domain/src';""",
          )

          replace(
              'packages/ui/src/manual-screen.ts',
              """  readonly message = signal('');
            readonly errors = signal<Record<string, string>>({});
            ownerId = '';""",
              """  readonly message = signal('');
            readonly errors = signal<Record<string, string>>({});
            readonly pending = signal<ManualCommand | undefined>(undefined);
            ownerId = '';""",
          )

          replace(
              'packages/ui/src/manual-screen.ts',
              """  setKind(kind: 'expense' | 'income') {
              if (this.busy()) return;""",
              """  setKind(kind: 'expense' | 'income') {
              if (this.busy() || this.pending()) return;""",
          )

          replace(
              'packages/ui/src/manual-screen.ts',
              """          <button
                    fpButton
                    type=\"submit\"
                    [disabled]=\"busy() || !activeAccounts().length || !compatibleCategories().length\"
                  >
                    Guardar movimiento
                  </button>
                  <p class=\"zone-note\">""",
              """          <button
                    fpButton
                    type=\"submit\"
                    [disabled]=\"
                      busy() || !!pending() || !activeAccounts().length || !compatibleCategories().length
                    \"
                  >
                    Guardar movimiento
                  </button>
                  @if (pending()) {
                    <div class=\"manual-retry\" role=\"alert\">
                      <p>
                        No recibimos una confirmación definitiva. Conservamos exactamente el mismo
                        identificador para que un reintento no duplique el movimiento.
                      </p>
                      <button fpButton type=\"button\" [disabled]=\"busy()\" (click)=\"retryPending()\">
                        Reintentar mismo movimiento
                      </button>
                      <button fpButton type=\"button\" [disabled]=\"busy()\" (click)=\"discardPending()\">
                        Descartar intento
                      </button>
                    </div>
                  }
                  <p class=\"zone-note\">""",
          )

          replace(
              'packages/ui/src/manual-screen.ts',
              """  async save() {
              const catalog = this.catalog();
              if (this.busy() || !catalog || !this.ownerId) return;
              const errors: Record<string, string> = {};
              if (!this.accountId) errors['account'] = 'Elige una cuenta.';
              if (!this.categoryId) errors['category'] = 'Elige una categoría.';
              let money: Money | undefined;
              try {
                money = manualAmount(this.amount, this.currency());
              } catch {
                errors['amount'] = 'Introduce un importe positivo con hasta dos decimales.';
              }
              try {
                financialDate(
                  { businessDate: this.businessDate, timezone: 'America/Lima' },
                  { now: () => new Date() },
                );
              } catch {
                errors['date'] = 'Introduce una fecha válida, no futura.';
              }
              if ([...this.note].length > 500 || /[\\p{Cc}\\p{Cf}]/u.test(this.note))
                errors['note'] = 'La nota no puede superar 500 caracteres ni contener controles.';
              this.errors.set(errors);
              if (Object.keys(errors).length || !money) return;

              try {
                const command = normalizeManual(
                  {
                    operationId: crypto.randomUUID(),
                    movementId: crypto.randomUUID(),
                    deviceId: crypto.randomUUID(),
                    schemaVersion: 1,
                    baseVersion: '0',
                    payload: {
                      kind: this.kind,
                      accountId: this.accountId,
                      categoryId: this.categoryId,
                      ...money.toJSON(),
                      businessDate: this.businessDate,
                      timezone: 'America/Lima',
                      ...(this.note.trim() ? { note: this.note.trim() } : {}),
                    },
                  },
                  { now: () => new Date() },
                );
                validateManualReferences(command, catalog);
                this.busy.set(true);
                await this.auth.syncApi(this.ownerId).send(command, AbortSignal.timeout(15000));
                this.amount = '';
                this.note = '';
                this.message.set('Movimiento guardado y confirmado.');
                await this.workspace.openRemote();
              } catch {
                this.message.set(
                  'No pudimos guardar el movimiento. Revisa los datos o tu conexión e inténtalo nuevamente.',
                );
              } finally {
                this.busy.set(false);
              }
            }""",
              """  async save() {
              const catalog = this.catalog();
              if (this.busy() || this.pending() || !catalog || !this.ownerId) return;
              const errors: Record<string, string> = {};
              if (!this.accountId) errors['account'] = 'Elige una cuenta.';
              if (!this.categoryId) errors['category'] = 'Elige una categoría.';
              let money: Money | undefined;
              try {
                money = manualAmount(this.amount, this.currency());
              } catch {
                errors['amount'] = 'Introduce un importe positivo con hasta dos decimales.';
              }
              try {
                financialDate(
                  { businessDate: this.businessDate, timezone: 'America/Lima' },
                  { now: () => new Date() },
                );
              } catch {
                errors['date'] = 'Introduce una fecha válida, no futura.';
              }
              if ([...this.note].length > 500 || /[\\p{Cc}\\p{Cf}]/u.test(this.note))
                errors['note'] = 'La nota no puede superar 500 caracteres ni contener controles.';
              this.errors.set(errors);
              if (Object.keys(errors).length || !money) return;

              try {
                const command = normalizeManual(
                  {
                    operationId: crypto.randomUUID(),
                    movementId: crypto.randomUUID(),
                    deviceId: crypto.randomUUID(),
                    schemaVersion: 1,
                    baseVersion: '0',
                    payload: {
                      kind: this.kind,
                      accountId: this.accountId,
                      categoryId: this.categoryId,
                      ...money.toJSON(),
                      businessDate: this.businessDate,
                      timezone: 'America/Lima',
                      ...(this.note.trim() ? { note: this.note.trim() } : {}),
                    },
                  },
                  { now: () => new Date() },
                );
                validateManualReferences(command, catalog);
                this.pending.set(command);
                await this.retryPending();
              } catch {
                this.message.set('Revisa los datos del movimiento antes de guardarlo.');
              }
            }

            async retryPending() {
              const command = this.pending();
              if (!command || this.busy() || !this.ownerId) return;
              this.busy.set(true);
              try {
                await this.auth.syncApi(this.ownerId).send(command, AbortSignal.timeout(15000));
                this.pending.set(undefined);
                this.amount = '';
                this.note = '';
                this.message.set('Movimiento guardado y confirmado.');
                await this.workspace.openRemote();
              } catch {
                this.message.set(
                  'No pudimos confirmar el movimiento. El mismo intento se conserva para reintentar sin duplicarlo.',
                );
              } finally {
                this.busy.set(false);
              }
            }

            discardPending() {
              if (this.busy()) return;
              this.pending.set(undefined);
              this.message.set('Intento descartado. Puedes editar y registrar un movimiento nuevo.');
            }""",
          )
          PY
      - run: npm exec prettier -- --write packages/ui/src/product-workspace.ts packages/ui/src/manual-screen.ts packages/ui/src/shell.ts tests/auth.system.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/product-workspace.ts packages/ui/src/manual-screen.ts packages/ui/src/shell.ts tests/auth.system.ts
          git commit -m "fix(product): preserve remote financial intents safely"
          git push origin HEAD:feature/p17-real-app
