name: Calidad
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: full
        options: [full, sync-server, correction-server, android]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.files.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: files
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: node scripts/ci-native-changes.mjs
  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'android'
    name: Lint, tests y builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run lint
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm run format:check
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm run typecheck
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm test
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm run test:integration
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm run test:postgres
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm run test:postgres -- --suite=tests/sync.integration.test.ts
        if: inputs.scope == 'sync-server'
      - run: npm run test:postgres -- --suite=tests/corrections.integration.test.ts
        if: inputs.scope == 'correction-server'
      - run: npm run build
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - run: npm run security
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
        with:
          name: builds-${{ github.sha }}
          path: dist/
  android:
    needs: changes
    if: inputs.scope == 'android' || (inputs.scope != 'sync-server' && inputs.scope != 'correction-server' && needs.changes.outputs.native == 'true')
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run cap:sync
      - name: Build debug
        working-directory: apps/mobile/android
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Build provenance
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/build-info.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-demo-debug-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            dist/build-info.json
          retention-days: 14
      - name: Real SQLCipher offline reopen
        timeout-minutes: 15
        run: bash scripts/test-android-offline.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-offline-${{ github.sha }}
          path: dist/android-offline/
          retention-days: 14
  ios:
    needs: changes
    if: inputs.scope != 'android' && inputs.scope != 'sync-server' && inputs.scope != 'correction-server' && needs.changes.outputs.native == 'true'
    name: iOS simulator sin firma
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run cap:sync
      - name: Build simulator only
        run: xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath dist/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-unsigned-${{ github.sha }}
          path: dist/ios/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
  auth-system:
    if: inputs.scope != 'android' && inputs.scope != 'sync-server' && inputs.scope != 'correction-server'
    name: Browser + PostgreSQL auth y sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:backend
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:auth-system
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-system-visual-${{ github.sha }}
          path: |
            docs/evidence/P05/mfa-*.png
            docs/evidence/P09/product-*.png
            docs/evidence/P10/conflict-*.png
          retention-days: 7
