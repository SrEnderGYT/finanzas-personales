name: P17 Bootstrap Diagnostic One Shot
on:
  push:
    branches: ['feature/p17-real-app']
    paths: ['.github/workflows/p17-bootstrap-diagnostic-one-shot.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Add safe bootstrap stage diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/start-staging.mjs')
          s = p.read_text()
          replacements = [
              ("const mode = process.env.STAGING_MODE;\n", "const mode = process.env.STAGING_MODE;\nlet bootstrapStage = 'not-started';\n"),
              ("async function bootstrap(config) {\n", "async function bootstrap(config) {\n  bootstrapStage = 'admin-config';\n"),
              ("  const admin = new pg.Pool({ connectionString: url.href, max: 1, connectionTimeoutMillis: 5000 });\n", "  bootstrapStage = 'admin-connect';\n  const admin = new pg.Pool({ connectionString: url.href, max: 1, connectionTimeoutMillis: 5000 });\n"),
              ("    await migrate(admin);\n", "    bootstrapStage = 'migrate';\n    await migrate(admin);\n    bootstrapStage = 'roles';\n"),
              ("  const { UserDatabase } = load('../dist/api/database.js');\n", "  bootstrapStage = 'runtime-check';\n  const { UserDatabase } = load('../dist/api/database.js');\n"),
              ("    const email = 'reviewer@example.test';\n", "    bootstrapStage = 'reviewer';\n    const email = 'reviewer@example.test';\n"),
              ("  // No financial API runs while administrator/bootstrap credentials are present.\n", "  bootstrapStage = 'ready';\n  // No financial API runs while administrator/bootstrap credentials are present.\n"),
              ("  const migration = /^\\d{3}_[a-z_]+\\.sql$/.test(error?.migrationName ?? '')\n    ? error.migrationName\n    : undefined;\n", "  const migration = /^\\d{3}_[a-z_]+\\.sql$/.test(error?.migrationName ?? '')\n    ? error.migrationName\n    : undefined;\n  const stage =\n    mode === 'bootstrap' && /^[a-z-]+$/.test(bootstrapStage) ? bootstrapStage : undefined;\n"),
              ("    JSON.stringify({ status: 'staging-start-failed', sqlState, migration }) + '\\n',\n", "    JSON.stringify({ status: 'staging-start-failed', sqlState, migration, stage }) + '\\n',\n"),
          ]
          for old, new in replacements:
              if new in s:
                  continue
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npx prettier --write scripts/start-staging.mjs
      - run: node --check scripts/start-staging.mjs
      - run: npm run lint
      - run: npm run format:check
      - name: Commit validated diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/start-staging.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'chore(staging): add safe bootstrap stage diagnostic'
          git push origin HEAD:feature/p17-real-app
