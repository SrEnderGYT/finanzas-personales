name: UI Format Helper

on:
  push:
    branches: [feature/p17-reference-ui-refresh]
    paths:
      - .github/workflows/ui-format.yml
      - angular.json
      - packages/ui/src/reference-design-v2.css

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-reference-ui-refresh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm exec prettier -- --write packages/ui/src/reference-design-v2.css angular.json
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/reference-design-v2.css angular.json
          git commit -m "style(ui): format reference design files"
          git push origin HEAD:feature/p17-reference-ui-refresh
