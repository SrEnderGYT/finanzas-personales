name: Fix detected-finances regex

on:
  push:
    branches:
      - feature/p17-real-app
    paths:
      - .github/workflows/fix-detected-regex.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: python scripts/fix_detected_regex.py
      - run: npm exec prettier -- --write packages/ui/src/detected-finances-screen.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:web
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/detected-finances-screen.ts
          git commit -m "fix(finance): sanitize product regex boundaries"
          git push origin HEAD:feature/p17-real-app
