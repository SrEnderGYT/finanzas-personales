name: P17 semantic dashboard patch

on:
  push:
    branches:
      - feature/p17-real-app
    paths:
      - .github/workflows/p17-semantic-dashboard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: python scripts/p17_semantic_dashboard_patch.py
      - run: npm exec prettier -- --write backend/api/src/financial-mail-parser.ts backend/api/src/gmail-service.ts packages/shared/src/gmail-candidates.ts packages/shared/src/gmail-semantics.ts packages/ui/src/gmail-screen.ts packages/ui/src/detected-finances-screen.ts packages/ui/src/product-screen.ts packages/ui/src/finance-dashboard.ts packages/ui/src/finance-dashboard.css tests/gmail-ingestion.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm exec vitest -- run tests/gmail-ingestion.test.ts
      - run: npm run build:web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/src/financial-mail-parser.ts backend/api/src/gmail-service.ts packages/shared/src/gmail-candidates.ts packages/shared/src/gmail-semantics.ts packages/ui/src/gmail-screen.ts packages/ui/src/detected-finances-screen.ts packages/ui/src/product-screen.ts packages/ui/src/finance-dashboard.ts packages/ui/src/finance-dashboard.css tests/gmail-ingestion.test.ts
          git commit -m "feat(p17): harden Gmail semantics and dashboard"
          git push origin HEAD:feature/p17-real-app
