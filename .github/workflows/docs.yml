name: Documentacion
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  docs:
    name: Integridad documental
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validar propuesta
        run: python3 scripts/check_docs.py
  format-reference-design:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/p17-real-app'
    name: Normalizar diseño de referencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Ejecutar Prettier del proyecto
        run: >-
          npm exec prettier -- --write
          apps/mobile/src/styles.css
          apps/web/src/styles.css
          packages/ui/src/detected-finances-screen.css
          packages/ui/src/finance-dashboard.css
          packages/ui/src/premium-theme.css
      - name: Guardar normalizacion si aplica
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios de formato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/styles.css apps/web/src/styles.css packages/ui/src/detected-finances-screen.css packages/ui/src/finance-dashboard.css packages/ui/src/premium-theme.css
          git commit -m "style(ui): normalize reference design"
          git push origin HEAD:feature/p17-real-app
