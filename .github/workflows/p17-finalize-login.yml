name: P17 Finalize Login Surface
on:
  push:
    branches: ['feature/p17-real-app']
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/p17-real-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Finalize login-first wording and browser contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('packages/ui/src/auth-screen.ts')
          text = auth.read_text()
          text = text.replace("import { RouterLink } from '@angular/router';\n", '')
          text = text.replace(
              'imports: [FormsModule, RouterLink, DatePipe, MfaEnrollment],',
              'imports: [FormsModule, DatePipe, MfaEnrollment],',
          )
          text = text.replace(
              '<p>Conectar Gmail requerirá un permiso diferente, en una fase posterior.</p>',
              '<p>Conectar Gmail usa una autorización separada de solo lectura después de iniciar sesión.</p>',
          )
          old_back = '''        <a routerLink="/inicio" class="auth-back">{{\n          client.enabled ? '← Volver a Mi espacio' : '← Volver a la vista de muestra'\n        }}</a>\n'''
          if old_back not in text:
              raise SystemExit('auth back-link block not found')
          text = text.replace(old_back, '', 1)
          old_notice = '''        @if (!client.enabled) {\n          <p class="auth-notice" role="note">\n            <strong>Vista previa</strong><br />El acceso real aún no está conectado aquí. Explora\n            los formularios sin introducir datos personales.\n          </p>\n        }\n'''
          new_notice = '''        @if (!client.enabled) {\n          <p class="auth-notice" role="status">\n            <strong>Servidor de Finanzas no conectado</strong><br />\n            El inicio de sesión se habilitará cuando el API privado HTTPS esté disponible. Los\n            campos permanecen bloqueados para proteger tus credenciales.\n          </p>\n        }\n'''
          if old_notice not in text:
              raise SystemExit('disabled API notice not found')
          text = text.replace(old_notice, new_notice, 1)
          auth.write_text(text)

          auth_test = Path('tests/auth.e2e.ts')
          text = auth_test.read_text()
          old_public = '''test('public entry never exposes a fake login or private navigation without an API', async ({ page }) => {\n  let requests = 0;\n  page.on('request', (request) => {\n    if (request.url().includes('/v1/auth/')) requests++;\n  });\n  await page.setViewportSize({ width: 1440, height: 1000 });\n  await page.goto('/#/acceso');\n  await expect(page.getByRole('heading', { name: 'Tu información empieza con tu cuenta.' })).toBeVisible();\n  await expect(page.getByText('Servidor de Finanzas no configurado')).toBeVisible();\n  await expect(page.getByLabel('Correo electrónico')).toHaveCount(0);\n  await expect(page.locator('.sidebar')).toHaveCount(0);\n  await page.setViewportSize({ width: 390, height: 844 });\n  for (const theme of ['light', 'dark'] as const) {\n    await page.emulateMedia({ colorScheme: theme });\n    await page.goto('http://127.0.0.1:4174/#/acceso');\n    await expect(page.getByRole('heading', { name: 'Tu información empieza con tu cuenta.' })).toBeVisible();\n    expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth)).toBe(true);\n    const audit = await new AxeBuilder({ page })\n      .withTags(['wcag2a', 'wcag2aa', 'wcag21aa'])\n      .analyze();\n    expect(audit.violations.map((entry) => entry.id)).toEqual([]);\n  }\n  expect(requests).toBe(0);\n});\n'''
          new_public = '''test('public entry is login-first and never exposes private navigation without an API', async ({ page }) => {\n  let requests = 0;\n  page.on('request', (request) => {\n    if (request.url().includes('/v1/auth/')) requests++;\n  });\n  await page.setViewportSize({ width: 1440, height: 1000 });\n  await page.goto('/#/acceso');\n  await expect(page.getByRole('heading', { name: 'Un lugar para tenerlo claro.' })).toBeVisible();\n  await expect(page.getByRole('heading', { name: 'Bienvenido de nuevo' })).toBeVisible();\n  await expect(page.getByText('Servidor de Finanzas no conectado')).toBeVisible();\n  await expect(page.getByLabel('Correo electrónico')).toBeDisabled();\n  await expect(page.getByLabel('Contraseña', { exact: true })).toBeDisabled();\n  await expect(page.getByRole('button', { name: 'Entrar', exact: true })).toBeDisabled();\n  await expect(page.locator('.sidebar')).toHaveCount(0);\n  await expect(page.getByText(/DEMO|Vista previa|vista de muestra/i)).toHaveCount(0);\n  await page.setViewportSize({ width: 390, height: 844 });\n  for (const theme of ['light', 'dark'] as const) {\n    await page.emulateMedia({ colorScheme: theme });\n    await page.goto('http://127.0.0.1:4174/#/acceso');\n    await expect(page.getByRole('heading', { name: 'Un lugar para tenerlo claro.' })).toBeVisible();\n    expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth)).toBe(true);\n    const audit = await new AxeBuilder({ page })\n      .withTags(['wcag2a', 'wcag2aa', 'wcag21aa'])\n      .analyze();\n    expect(audit.violations.map((entry) => entry.id)).toEqual([]);\n  }\n  expect(requests).toBe(0);\n});\n'''
          if old_public not in text:
              raise SystemExit('public auth test block not found')
          auth_test.write_text(text.replace(old_public, new_public, 1))

          ui = Path('tests/ui.e2e.ts')
          text = ui.read_text()
          text = text.replace("await expect(page.getByRole('heading', { name: 'Tu información empieza con tu cuenta.' })).toBeVisible();", "await expect(page.getByRole('heading', { name: 'Un lugar para tenerlo claro.' })).toBeVisible();")
          text = text.replace("await expect(page.getByText('Servidor de Finanzas no configurado')).toBeVisible();", "await expect(page.getByText('Servidor de Finanzas no conectado')).toBeVisible();\n  await expect(page.getByRole('heading', { name: 'Bienvenido de nuevo' })).toBeVisible();\n  await expect(page.getByLabel('Correo electrónico')).toBeDisabled();")
          text = text.replace("['inicio', 'movimientos', 'registro', 'cuentas', 'gmail', 'tarjetas', 'presupuestos', 'analisis', 'configuracion']", "['inicio', 'movimientos', 'registro', 'cuentas', 'gmail', 'tarjetas', 'suscripciones', 'deudas', 'presupuestos', 'analisis', 'configuracion']")
          ui.write_text(text)
          PY
      - name: Format and validate login-first app
        run: |
          npm exec -- prettier --write packages/ui/src/auth-screen.ts tests/auth.e2e.ts tests/ui.e2e.ts
          npm run typecheck
          npm run build:web
      - name: Remove one-shot workflow
        run: rm .github/workflows/p17-finalize-login.yml
      - name: Commit final login surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/auth-screen.ts tests/auth.e2e.ts tests/ui.e2e.ts .github/workflows/p17-finalize-login.yml
          git commit -m "feat(p17): finalize login-first public surface"
          git push origin HEAD:feature/p17-real-app
