          )

          # Migration for existing connections / false positives already stored.
          Path('backend/api/migrations/025_gmail_90d_products_cleanup.sql').write_text("""-- Keep enough Gmail history to detect recurring subscriptions and correct known product semantics.
UPDATE app.gmail_connections
SET range_days = 90,
    updated_at = now()
WHERE range_days < 90;

-- Interbank Visa Access is treated as a loan/debt product, not a credit-card purchase stream.
UPDATE app.gmail_financial_candidates
SET kind = 'debt',
    confidence = GREATEST(confidence, 96)
WHERE institution = 'Interbank'
  AND summary ~* '(^|[^[:alnum:]])(IBK[[:space:]]+)?Visa Access([^[:alnum:]]|$)'
  AND status <> 'discarded';

-- Remove only still-pending commercial false positives; preserve reviewed history.
DELETE FROM app.gmail_financial_candidates
WHERE status = 'pending'
  AND summary ~* '(gana(?:r)?|puntos?|millas?|sacar[[:space:]]+millas|participa|sorteo|premio|descuentos?|dscto|oferta|promoci[oó]n|beneficio|preventa|ll[eé]vate|regalo con tu compra|pr[oó]xima compra|compra favorita|cashback.*(?:sorteo|premio|gana)|cambia.*y gana|pasajes?.*desde)';
""")

          # Regression tests from the reported false positives and product semantics.
          replace(
              'tests/gmail-ingestion.test.ts',
              "  it('classifies a card-payment receipt as payment, never as income', () => {",
              "  it('ignores the additional Plin, miles and discount promotions seen in the review inbox', () => {\n    expect(\n      mail(\n        'Hoy tenemos sesión de cómo sacar millas con plin sin que te baneen! Los veo a las 9PM!',\n        'Reserva tu acceso por S/ 9.00.',\n        'Comunidad <promo@example.com>',\n      ),\n    ).toBeUndefined();\n    expect(\n      mail(\n        'Gana hasta S/300 con Plin BBVA',\n        'Participa usando Plin.',\n        'BBVA <beneficios@bbva.pe>',\n      ),\n    ).toBeUndefined();\n    expect(\n      mail(\n        '¡Llévate S/100 de dscto en pisos para tu hogar!',\n        'Compra desde hoy.',\n        'Tienda <promo@example.com>',\n      ),\n    ).toBeUndefined();\n  });\n\n  it('treats Interbank Visa Access as debt, not as a credit card', () => {\n    expect(\n      mail(\n        'IBK Visa Access - deuda total',\n        'Tu deuda total de Visa Access es S/ 6,332.05.',\n        'Interbank <avisos@interbank.pe>',\n      ),\n    ).toMatchObject({ kind: 'debt', institution: 'Interbank', amountMinor: 633205 });\n  });\n\n  it('classifies a card-payment receipt as payment, never as income', () => {",
          )
          PY
      - name: Format
        run: npm exec prettier -- --write backend/api/src/financial-mail-parser.ts backend/api/src/gmail-service.ts packages/ui/src/gmail-screen.ts packages/ui/src/gmail-screen.css packages/ui/src/detected-finances-screen.ts packages/ui/src/product-screen.ts packages/ui/src/manual-screen.css tests/gmail-ingestion.test.ts
      - name: Validate focused changes
        run: |
          npm run typecheck
          npm exec vitest -- run tests/gmail-ingestion.test.ts
