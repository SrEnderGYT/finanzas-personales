"""
          )
          Path('packages/ui/src/manual-screen.css').write_text(
              Path('packages/ui/src/manual-screen.css').read_text()
              + """

.expense-chart-card {
  margin: 18px 0;
}

.expense-chart-row {
  padding: 14px 0;
  border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent);
}

.expense-chart-label {
  display: flex;
