<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="finanzas-auth" content="disabled" />
    <meta name="finanzas-api-origin" content="" />
    <meta name="referrer" content="no-referrer" />
    <title>Finanzas · Tu espacio personal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Aplicación personal para organizar cuentas, movimientos, tarjetas, presupuestos y automatización financiera."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#635BFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <script>
      (() => {
        const resetKey = 'finanzas-p17-cache-reset-v1';
        if (sessionStorage.getItem(resetKey) === 'done') return;
        window.addEventListener('load', async () => {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(
                registrations
                  .filter((registration) => registration.scope.includes('/finanzas-personales/'))
                  .map((registration) => registration.unregister()),
              );
            }
            if ('caches' in window) {
              const names = await caches.keys();
              await Promise.all(
                names
                  .filter((name) => name.startsWith('ngsw:') || name.includes('finanzas'))
                  .map((name) => caches.delete(name)),
              );
            }
            sessionStorage.setItem(resetKey, 'done');
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
              location.replace(location.pathname + '?fresh=p17' + location.hash);
            }
          } catch {
            sessionStorage.setItem(resetKey, 'done');
          }
        });
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
